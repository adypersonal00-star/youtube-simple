name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['source.zip', '.github/workflows/build.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: unzip -o source.zip -d .
      - run: gradle --no-daemon assembleDebug
      - run: test -s app/build/outputs/apk/debug/app-debug.apk && sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-simple-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
